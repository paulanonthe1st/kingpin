<!DOCTYPE html>
<html>
<head>
<title>social links profile</title>
<style>
body{
  background: #141414;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  font-family: sans-serif;
}
.card{
  background: #1f1f1f;
  width: 350px;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  color: white;
}
.avatar{
  width: 90px;
  height: 90px;
  border-radius: 50%;
  margin-bottom: 20px;
}
.location{color: #c4f82a; font-weight: bold; margin: 10px 0 20px;}
.bio{color: #ccc; font-size: 14px; margin-bottom: 20px;}
.links a{
  display: block;
  background: #333;
  color: white;
  text-decoration: none;
  padding: 12px;
  border-radius: 8px;
  margin: 12px 0;
  font-weight: bold;
}
</style>
</head>
<body>
<div class="card">
<img src="https://i.pravatar.cc/150?img=32" class="avatar">
<h1>karen nyambura</h1>
<p class="location">Nyeri, Kenya</p>
<p class="bio">Front-end Developer</p>
<div class="links">
<a href="#">GitHub</a>
<a href="#">Frontend Mentor</a>
<a href="#">LinkedIn</a>
<a href="#">Twitter</a>
</div>
</div>
</body>
</html>
